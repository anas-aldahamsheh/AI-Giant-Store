<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-label="Giant Store">
  <defs>
    <linearGradient id="gs-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .word { fill: #4338ca; }
    .tag { fill: #8b5cf6; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #e0e7ff; }
      .tag { fill: #a78bfa; }
    }
  </style>
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#gs-gradient)"/>
  <text x="48" y="61" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">GS</text>
  <text x="112" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="900" class="word">Giant Store</text>
  <text x="114" y="76" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" class="tag">AI MARKETPLACE</text>
</svg>
